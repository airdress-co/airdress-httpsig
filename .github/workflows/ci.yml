name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint and test
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # No private dependency and no credential: every dependency of
      # this crate is public, which is the whole reason it exists as a
      # separate repository.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  deny:
    name: Licences, advisories and the telemetry bans
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The pinned binary, not EmbarkStudios/cargo-deny-action: that
      # action runs in a container, and in airdress-cli its inability to
      # see the runner's git credential surfaced as a licence error.
      # One less third-party action holding a token, too.
      - name: Licences, advisories, bans and sources
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          tarball="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${tarball}"
          echo "${DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" --strip-components=1 \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          ./cargo-deny --all-features check licenses advisories bans sources
