[package]
name = "airdress-httpsig"
version = "0.1.104"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The RFC 9421 request-signing profile airdress operators sign with — one implementation for every signer."

[dependencies]
base64.workspace = true
bytes = "1"
http = "1"
http-body-util = "0.1"
# Pinned exactly: pre-1.0, every bump reviewed (SPEC-095 095-C.0, operator
# PR #198). Must match the pins in airdress-fn and airdress-operator.
httpsig-hyper = "=0.0.26"
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
